<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Representation in HTML</title>
</head>
<body>
    <h3>Image Representation in HTML</h3>
    <img src="image.jpg.jpeg" alt="Description of the image" height="300" width="300">

    <h3  align="right">Image Representation as the link in HTML</h3><br>
    <a href="https://www.facebook.com" target="_blank">
    <img src="image.jpg.jpeg" alt="Description of the image" height="300" width="300" align="right">
    </a>

    <h3>Audio Representation in HTML</h3>
    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <h3>Video Representation in HTML</h3>  
    <video width="300" controls>
        <source src="videomp4.mp4" type="video/mp4">
        Your browser does not support the video element.
    </video>
</body>
</html>
