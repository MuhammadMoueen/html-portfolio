<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Representation of Links in HTML</title>
</head>
<body>
    <h3>External Links that open in same tab</h3>
    <p><a href="https://www.google.com" >Visit Google</a></p>
    <p><a href="https://www.github.com" >Visit GitHub</a></p>

    <h3>External Links that open in new tab</h3>
    <p><a href="https://www.google.com" target="_blank" >Visit Google</a></p>
    <p><a href="https://www.github.com" target="_blank" >Visit GitHub</a></p>

    <h3>Internal Links </h3>
    <p><a href="mypage.html">Go to My Page</a></p>
    
    <h3>Anchor Links that link to sections within the same page</h3>
    <p><a href="#section1">Go to Section 1</a></p>
    <p><a href="#section2">Go to Section 2</a></p>

    <h3>Email Link</h3>
    <a href="mailto:muhammadmoueen5@gmail.com">Send Email to Muhammad</a>

</body>
</html>
