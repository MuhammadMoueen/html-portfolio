<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Page</title>
</head>
<body>
     <header>
  <h1>My Website</h1>
     </header>

    <nav>
  <a href="#">Home</a> |
  <a href="#">About</a>
    </nav>
    
<main>

  <section>
    <h2>Services</h2>
    <p>We build websites.</p>
  </section>

  <article>
    <h2>Blog Post</h2>
    <p>This is an article content.</p>
  </article>

  <aside>
    <p>Sidebar content</p>
  </aside>

  <figure>
    <img src="image.jpg.jpeg" width="200">
    <figcaption>Sample Image</figcaption>
  </figure>

  <details>
    <summary>More Info</summary>
    <p>Hidden details content.</p>
  </details>

</main>

<footer>
  <p>© 2026 My Website</p>
</footer> 
</body>
</html>
